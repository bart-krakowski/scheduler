apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: scheduler-saas
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: scheduler-saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "Waiting for rabbitmq..."
                sleep 2
              done
      containers:
        - name: api
          image: ghcr.io/scheduler-saas/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: scheduler-config
                  key: API_PORT
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: scheduler-config
                  key: WEB_ORIGIN
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672"
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
