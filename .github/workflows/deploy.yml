name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, notifications, scheduling, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          for var in K8S_SERVER K8S_CA_CERT K8S_TOKEN; do
            test -n "${!var}" || { echo "$var secret is empty"; exit 1; }
          done
          echo "$K8S_CA_CERT" | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl config set-cluster target --server="$K8S_SERVER" --certificate-authority="$RUNNER_TEMP/ca.crt" --embed-certs=true
          kubectl config set-credentials ci-deployer --token="$K8S_TOKEN"
          kubectl config set-context target --cluster=target --user=ci-deployer --namespace=scheduler-saas
          kubectl config use-context target
          kubectl auth can-i patch deployment/api -n scheduler-saas
      - run: |
          for app in api notifications scheduling web; do
            kubectl set image deployment/$app $app=${{ env.REGISTRY }}/$app:${{ github.sha }} -n scheduler-saas
          done
      - run: |
          kubectl delete job scheduler-migrate -n scheduler-saas --ignore-not-found
          kubectl apply -f k8s/base/migrate.yaml -n scheduler-saas
          kubectl wait --for=condition=complete job/scheduler-migrate -n scheduler-saas --timeout=300s
      - run: |
          kubectl rollout status deployment/api deployment/notifications deployment/scheduling deployment/web -n scheduler-saas --timeout=300s
